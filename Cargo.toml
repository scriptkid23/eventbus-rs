[workspace]
members = [
    "crates/bus-core",
    "crates/bus-macros",
    "crates/bus-nats",
    "crates/event-bus",
    "examples/01-basic-publish",
    "examples/03-idempotent-handler",
]
resolver = "2"

[workspace.package]
version    = "0.1.1"
edition    = "2024"
authors    = ["Olivier Taylor <tech@1hoodlabs.xyz>"]
license    = "MIT OR Apache-2.0"
repository = "https://github.com/scriptkid23/eventbus-rs"

[workspace.dependencies]
async-nats   = "0.46"
async-trait  = "0.1"
bytes        = "1.5"
futures-util = "0.3"
redis        = { version = "0.26", features = ["tokio-comp", "connection-manager", "script"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
tokio        = { version = "1.36", features = ["full"] }
tracing      = "0.1"
uuid         = { version = "1", features = ["v7", "serde"] }
# proc-macro deps
proc-macro2  = "1"
quote        = "1"
syn          = { version = "2", features = ["full"] }
# test deps
testcontainers = "0.23"
